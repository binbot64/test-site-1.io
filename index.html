<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conlang Workshop</title>
    <style>
      :root {
        --bg: #0f1726;
        --bg-2: #121c2c;
        --panel: rgba(18, 29, 42, 0.9);
        --panel-strong: #162534;
        --panel-alt: #1a2c3f;
        --line: rgba(148, 163, 184, 0.2);
        --text: #e5ecf6;
        --muted: #9bb0c9;
        --accent: #7dd3fc;
        --accent-2: #c084fc;
        --gold: #f7c873;
        --green: #7ee9b1;
        --danger: #ff7d7d;
        --shadow: 0 20px 45px rgba(2, 6, 23, 0.45);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top left, rgba(125, 211, 252, 0.18), transparent 26%),
          linear-gradient(135deg, var(--bg) 0%, #0d1420 45%, var(--bg-2) 100%);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
      }

      button, input, textarea, select {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        background: rgba(8, 13, 21, 0.8);
        backdrop-filter: blur(18px);
        border-right: 1px solid var(--line);
        padding: 22px 18px;
      }

      .brand {
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #09131d;
        font-weight: 900;
        box-shadow: var(--shadow);
      }

      .brand h2 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .sidebar .new-btn,
      .toolbar button,
      .add-item-btn,
      .compact-btn,
      .ipa-button,
      .preview-btn {
        border: 1px solid rgba(125, 211, 252, 0.25);
        background: rgba(125, 211, 252, 0.08);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .sidebar .new-btn:hover,
      .toolbar button:hover,
      .add-item-btn:hover,
      .compact-btn:hover,
      .ipa-button:hover,
      .preview-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(125, 211, 252, 0.45);
      }

      .conlang-list {
        margin-top: 18px;
        display: grid;
        gap: 10px;
      }

      .conlang-card {
        padding: 12px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.02);
        cursor: pointer;
        transition: 0.2s ease;
      }

      .conlang-card:hover {
        border-color: rgba(125, 211, 252, 0.4);
        background: rgba(125, 211, 252, 0.05);
      }

      .conlang-card.active {
        background: linear-gradient(135deg, rgba(125, 211, 252, 0.12), rgba(192, 132, 252, 0.08));
        border-color: rgba(125, 211, 252, 0.42);
      }

      .conlang-card h3 {
        margin: 0 0 6px;
        font-size: 1rem;
      }

      .conlang-card .meta {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .conlang-card .pill {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 8px;
        font-size: 0.72rem;
        border-radius: 999px;
        background: rgba(126, 233, 177, 0.1);
        color: var(--green);
        border: 1px solid rgba(126, 233, 177, 0.25);
      }

      .main {
        padding: 28px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        margin-bottom: 20px;
      }

      .topbar h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
      }

      .topbar p {
        margin: 6px 0 0;
        color: var(--muted);
      }

      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .panel {
        background: rgba(17, 25, 38, 0.78);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 18px;
      }

      .editor-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .field,
      .stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field label,
      .input-label {
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      input, textarea, select {
        width: 100%;
        background: rgba(255, 255, 255, 0.02);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 10px;
        padding: 11px 12px;
        outline: none;
      }

      input:focus, textarea:focus, select:focus {
        border-color: rgba(125, 211, 252, 0.6);
        box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.12);
      }

      textarea {
        resize: vertical;
        min-height: 90px;
      }

      .wide {
        grid-column: 1 / -1;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 30px 0 12px;
      }

      .section-head h2 {
        margin: 0;
        font-size: 1.4rem;
      }

      .add-item-btn {
        padding: 8px 12px;
      }

      .sub-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-top: 18px;
      }

      .list-wrap {
        display: grid;
        gap: 14px;
      }

      .item-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }

      .item-card .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .item-card .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
      }

      .compact-btn {
        padding: 7px 10px;
        font-size: 0.85rem;
      }

      .danger {
        border-color: rgba(255, 125, 125, 0.36);
        background: rgba(255, 125, 125, 0.08);
      }

      .ipa-panel {
        background: rgba(255, 255, 255, 0.016);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }

      .ipa-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }

      .ipa-chart {
        display: grid;
        gap: 12px;
      }

      .ipa-row {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
      }

      .ipa-button {
        min-height: 52px;
        width: 100%;
        padding: 8px 6px;
        font-size: 1.05rem;
        border-radius: 10px;
        display: grid;
        place-items: center;
      }

      .ipa-button:hover {
        background: rgba(125, 211, 252, 0.14);
      }

      .vowel-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .preview-box {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        background: rgba(125, 211, 252, 0.03);
        border-radius: 12px;
        color: var(--text);
      }

      .preview-box strong {
        display: block;
        margin-bottom: 6px;
        color: var(--gold);
      }

      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .editor-grid,
        .sub-grid {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">𐌰</div>
          <h2>Conlang Workshop</h2>
        </div>

        <button id="newConlangBtn" class="new-btn" type="button">+ New Conlang</button>
        <div id="conlangList" class="conlang-list"></div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="langNameTitle">Conlang</h1>
            <p id="langMeta">Store your world, sounds, grammar, and vocabulary.</p>
          </div>

          <div class="toolbar">
            <button id="exportBtn" type="button">Export JSON</button>
            <label class="compact-btn" style="display:inline-flex;align-items:center;cursor:pointer;">
              Import JSON
              <input id="importInput" type="file" accept="application/json" hidden />
            </label>
            <button id="resetBtn" type="button" class="danger">Reset</button>
          </div>
        </header>

        <section class="panel">
          <div class="editor-grid">
            <div class="field">
              <label for="conlangName">Conlang Name</label>
              <input id="conlangName" type="text" placeholder="Seshat" />
            </div>

            <div class="field">
              <label for="conlangFamily">Language Family / Style</label>
              <input id="conlangFamily" type="text" placeholder="Ancient river culture, synthetic" />
            </div>

            <div class="field">
              <label for="conlangStatus">Status</label>
              <select id="conlangStatus">
                <option value="In progress">In progress</option>
                <option value="Drafting">Drafting</option>
                <option value="Stable">Stable</option>
                <option value="Archived">Archived</option>
              </select>
            </div>

            <div class="field">
              <label for="conlangTags">Tags</label>
              <input id="conlangTags" type="text" placeholder="sacred, river, philosophy, syntax" />
            </div>

            <div class="field wide">
              <label for="conlangDescription">Short Description</label>
              <textarea id="conlangDescription" placeholder="A brief note about the language's mood, function, and identity..."></textarea>
            </div>

            <div class="field wide">
              <label for="conlangOverview">Overview</label>
              <textarea id="conlangOverview" placeholder="What is this language like in everyday use? Who speaks it? What is its cultural role?"></textarea>
            </div>

            <div class="field">
              <label for="phonConsonants">Consonants</label>
              <textarea id="phonConsonants" placeholder="/s, t, k, h, r, n, m, l, w, y/"></textarea>
            </div>

            <div class="field">
              <label for="phonVowels">Vowels</label>
              <textarea id="phonVowels" placeholder="/a, e, i, o, u/"></textarea>
            </div>

            <div class="field">
              <label for="phonStress">Stress / Syllables</label>
              <textarea id="phonStress" placeholder="Stress falls on the first syllable; syllables are open and sonorous."></textarea>
            </div>

            <div class="field">
              <label for="phonNotes">Phonology Notes</label>
              <textarea id="phonNotes" placeholder="Sound symbolism, alliteration patterns, use of glottal stops, etc."></textarea>
            </div>

            <div class="field wide">
              <div class="input-label">IPA Sound Preview</div>
              <div class="ipa-panel">
                <div class="ipa-head">
                  <strong>Interactive chart</strong>
                  <button id="ipaPlayBtn" class="preview-btn" type="button">Play sample</button>
                </div>
                <div id="ipaChart" class="ipa-chart"></div>
                <div class="preview-box">
                  <strong>Preview text</strong>
                  <div id="ipaPreviewText">sa-ra-te-ka</div>
                </div>
              </div>
            </div>

            <div class="field">
              <label for="gramWordOrder">Word Order</label>
              <textarea id="gramWordOrder" placeholder="SOV"></textarea>
            </div>

            <div class="field">
              <label for="gramCase">Case / Agreement</label>
              <textarea id="gramCase" placeholder="Agentive suffixes and postpositions; optional ergative marking."></textarea>
            </div>

            <div class="field">
              <label for="gramTense">Tense / Aspect</label>
              <textarea id="gramTense" placeholder="Past, present, future with aspectual particles."></textarea>
            </div>

            <div class="field">
              <label for="gramNotes">Grammar Notes</label>
              <textarea id="gramNotes" placeholder="Morphological patterns, compounds, honorific structures..."></textarea>
            </div>

            <div class="field">
              <label for="writingScript">Writing System</label>
              <textarea id="writingScript" placeholder="Cuneiform-like logographic script or a flowing cursive alphabet"></textarea>
            </div>

            <div class="field">
              <label for="writingNotes">Writing Notes</label>
              <textarea id="writingNotes" placeholder="Directional rules, letter forms, usage in ritual texts, handwriting style..."></textarea>
            </div>

            <div class="field wide">
              <label for="cultureNotes">Culture / Worldbuilding</label>
              <textarea id="cultureNotes" placeholder="Beliefs, social structure, rituals, naming traditions, environment, archetypes..."></textarea>
            </div>
          </div>
        </section>

        <div class="section-head">
          <h2>Lexicon</h2>
          <button class="add-item-btn" id="addLexiconBtn" type="button">Add Word</button>
        </div>
        <div id="lexiconList" class="list-wrap"></div>

        <div class="section-head">
          <h2>Example Sentences</h2>
          <button class="add-item-btn" id="addExampleBtn" type="button">Add Example</button>
        </div>
        <div id="exampleList" class="list-wrap"></div>

        <div class="section-head">
          <h2>Notes</h2>
          <button class="add-item-btn" id="addNoteBtn" type="button">Add Note</button>
        </div>
        <div id="noteList" class="list-wrap"></div>
      </main>
    </div>

    <script>
      const STORAGE_KEY = "conlang-workshop-data-v1";

      const baseState = {
        activeConlangId: null,
        conlangs: [
          {
            id: "seshat-demo",
            name: "Seshat",
            family: "River theology / lunar trade",
            status: "In progress",
            tags: ["sacred", "river", "mythic"],
            description: "A ceremonial language of a river-bound civilization, rich with ritual vocabulary and poetic forms.",
            overview: "Seshat is used among temple scribes, navigators, and law-keepers. It sounds measured and sacred, but remains practical in trade and ritual performance.",
            phonology: {
              consonants: "/s, t, k, h, r, n, m, l, w, y, dz, sh/",
              vowels: "/a, e, i, o, u/",
              stress: "Stress falls on the first syllable. Long vowels are common in ritual words.",
              notes: "The language favors sonorants and soft dental fricatives. Words for water and sky are often built from repeated syllables."
            },
            grammar: {
              wordOrder: "SOV, with clausal particles used to guide emphasis.",
              case: "Postpositions mark possession, direction, and tool-use. Atonement markers are attached to verbs.",
              tense: "Tense is expressed by particles before the verb; aspect is more important than strict time.",
              notes: "Roots are often triplets, reflecting repetition in prayer and memory."
            },
            writing: {
              script: "A wedge-and-circle script inspired by temple architecture and river glyphs.",
              notes: "Writing is often ornamental. Priestly records favor dense vertical stacks, while trade records use a simplified cursive form."
            },
            culture: "Seshat culture treats memory as sacred. Each family keeps a lineage of ritual names, and speech often reflects honor, lineage, and agricultural cycles.",
            lexicon: [
              { id: crypto.randomUUID(), term: "sara", gloss: "water", category: "nature", pronunciation: "SA-ra", notes: "Sacred and life-giving; used in blessings." },
              { id: crypto.randomUUID(), term: "tekh", gloss: "measure", category: "abstract", pronunciation: "TEKH", notes: "A core concept tied to law, ritual time, and record keeping." },
              { id: crypto.randomUUID(), term: "mora", gloss: "stone / memory", category: "concept", pronunciation: "MO-ra", notes: "The same root can refer to memory or memorial stone." }
            ],
            examples: [
              { id: crypto.randomUUID(), phrase: "Sara nesh tekh e-han.", translation: "The river keeps the measure of the world.", notes: "Common sacred phrase." },
              { id: crypto.randomUUID(), phrase: "Mora an-lu keri.", translation: "The stone remembers the old vow.", notes: "Expresses continuity and ancestral obligation." }
            ],
            notes: [
              "The root for 'memory' and 'stone' is intentionally shared.",
              "The language treats silence as a rhetorical device in formal speech."
            ]
          },
          {
            id: "aster-demo",
            name: "Aster",
            family: "Skyborne / pastoral",
            status: "Drafting",
            tags: ["astral", "nomadic", "soft"],
            description: "A lighter, more open language spoken by wandering sky herders and star-gazers.",
            overview: "Aster is smoother and more fluid than Seshat, designed for songs and oral tradition. It is used among caravan communities and long-distance travelers.",
            phonology: {
              consonants: "/h, l, r, m, n, s, t, k, v, y/",
              vowels: "/a, e, i, o, u/",
              stress: "Stress is light and often lands on the final syllable in songlike speech.",
              notes: "Contractions are common in spoken forms, making it highly musical."
            },
            grammar: {
              wordOrder: "VSO in poetry, SVO in everyday speech.",
              case: "Case is often implicit; pronouns carry the grammatical weight.",
              tense: "Tense is indicated by adverbial time words rather than inflection.",
              notes: "Nominal suffixes often carry emotional color and social relationship."
            },
            writing: {
              script: "An open, curving alphabet designed to resemble wind marks across a field.",
              notes: "Most caravan records are oral; the script persists mainly in songs and navigation markers."
            },
            culture: "Travel, stars, and cattle are central to Aster. Families swap songs and place-names with each caravan stop.",
            lexicon: [
              { id: crypto.randomUUID(), term: "vra", gloss: "wind", category: "nature", pronunciation: "vra", notes: "Used in metaphors for change and movement." },
              { id: crypto.randomUUID(), term: "lani", gloss: "path", category: "travel", pronunciation: "LA-ni", notes: "Also means 'destiny' in poetic contexts." },
              { id: crypto.randomUUID(), term: "hori", gloss: "song", category: "art", pronunciation: "HO-ri", notes: "A unit of memory, often used as a story title." }
            ],
            examples: [
              { id: crypto.randomUUID(), phrase: "Vra heni lani e-sar.", translation: "The wind opens the path before us.", notes: "A common travelers' phrase." },
              { id: crypto.randomUUID(), phrase: "Hori nara keth.", translation: "The song carries the old names.", notes: "Used in naming ceremonies." }
            ],
            notes: [
              "The word for 'path' and 'destiny' are intentionally close.",
              "Children learn songs before they learn the alphabet."
            ]
          }
        ]
      };

      const state = loadState();
      const defaultIpaSymbols = ["p", "t", "k", "b", "d", "g", "m", "n", "l", "s", "ʃ", "h", "i", "e", "a", "o", "u"];

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return structuredClone(baseState);
          const parsed = JSON.parse(raw);
          if (!parsed.conlangs || !parsed.conlangs.length) return structuredClone(baseState);
          if (!parsed.activeConlangId) parsed.activeConlangId = parsed.conlangs[0].id;
          return parsed;
        } catch (error) {
          console.warn("Failed to load data, resetting state.", error);
          return structuredClone(baseState);
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function currentConlang() {
        return state.conlangs.find((lang) => lang.id === state.activeConlangId) || state.conlangs[0];
      }

      function ensureActiveConlang() {
        if (!state.conlangs.length) {
          const newLang = makeBlankConlang("New Conlang");
          state.conlangs.push(newLang);
        }
        if (!state.activeConlangId || !state.conlangs.some((lang) => lang.id === state.activeConlangId)) {
          state.activeConlangId = state.conlangs[0].id;
        }
      }

      function makeBlankConlang(name = "New Conlang") {
        return {
          id: crypto.randomUUID(),
          name,
          family: "",
          status: "In progress",
          tags: [],
          description: "",
          overview: "",
          phonology: { consonants: "", vowels: "", stress: "", notes: "" },
          grammar: { wordOrder: "", case: "", tense: "", notes: "" },
          writing: { script: "", notes: "" },
          culture: "",
          lexicon: [],
          examples: [],
          notes: []
        };
      }

      function extractIpaSymbols(value, fallback = defaultIpaSymbols) {
        if (!value || !String(value).trim()) return fallback;
        const cleaned = String(value).replace(/\s+/g, " ");
        const matches = cleaned.match(/[A-Za-zəɛɪʊɔæɑɐɒɕɖɘɚɜɝɞɠɡɢɣɤɥɦɧɨɩɪɫɬɭɮɯɰɱɲɳɴɵɶɷɸɹɺɻɼɽɾʀʁʂʃʄʅʆʇʈʉʊʋʌʍʎʏʐʑʒʓʔʕʖʗʘʙʛʜʝʟʠʡʢʣʤʥʦʧʨʩʪʫʬʭʮʯːˑ̴̪̩̯̥̈́̂̌̚ʰʱʲʳʴʵʶʷʸ]/g) || [];
        return matches.length ? [...new Set(matches)].slice(0, 12) : fallback;
      }

      function generatePreviewText(lang) {
        const fromLexicon = (lang.lexicon || [])
          .map((entry) => (entry.pronunciation || entry.term || "").trim())
          .filter(Boolean)
          .slice(0, 3);

        if (fromLexicon.length) {
          return fromLexicon.join("-").replace(/\s+/g, "-").replace(/--+/g, "-") || "sa-ra-te-ka";
        }

        if (lang.name) {
          return `${(lang.name || "sa").slice(0, 2).toLowerCase()}-ra-te-ka`;
        }

        return "sa-ra-te-ka";
      }

      function speakPreview() {
        const lang = currentConlang();
        if (!window.speechSynthesis) {
          alert("Your browser does not support speech synthesis. The IPA chart will still preview visually.");
          return;
        }

        const text = generatePreviewText(lang).replace(/-/g, " ");
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 0.78;
        utterance.pitch = 1.1;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      }

      function renderIpaChart() {
        const lang = currentConlang();
        const chartRoot = document.getElementById("ipaChart");
        const ipaText = document.getElementById("ipaPreviewText");
        const vowels = extractIpaSymbols(lang?.phonology?.vowels || "", ["i", "e", "a", "o", "u"]);
        const consonants = extractIpaSymbols(lang?.phonology?.consonants || "", ["p", "t", "k", "b", "d", "g", "m", "n", "l", "s", "ʃ", "h"]);

        ipaText.textContent = generatePreviewText(lang);

        const consonantRow = `
          <div class="ipa-row">
            ${consonants.map((symbol) => `<button class="ipa-button" type="button" data-symbol="${escapeAttribute(symbol)}">${escapeHtml(symbol)}</button>`).join("")}
          </div>
        `;

        const vowelRow = `
          <div class="vowel-grid">
            ${vowels.map((symbol) => `<button class="ipa-button" type="button" data-symbol="${escapeAttribute(symbol)}">${escapeHtml(symbol)}</button>`).join("")}
          </div>
        `;

        chartRoot.innerHTML = `
          <div class="ipa-row" style="grid-template-columns: repeat(${Math.max(6, consonants.length)}, minmax(0, 1fr));">
            <div class="input-label" style="grid-column: 1 / -1; margin-bottom: 4px;">Consonants</div>
            ${consonants.map((symbol) => `<button class="ipa-button" type="button" data-symbol="${escapeAttribute(symbol)}">${escapeHtml(symbol)}</button>`).join("")}
          </div>
          <div class="vowel-grid">
            <div class="input-label" style="grid-column: 1 / -1; margin-bottom: 4px;">Vowels</div>
            ${vowels.map((symbol) => `<button class="ipa-button" type="button" data-symbol="${escapeAttribute(symbol)}">${escapeHtml(symbol)}</button>`).join("")}
          </div>
        `;

        chartRoot.querySelectorAll(".ipa-button").forEach((button) => {
          button.addEventListener("click", () => {
            const symbol = button.dataset.symbol;
            if (!symbol) return;
            const text = `${symbol}${symbol}`;
            const previewText = document.getElementById("ipaPreviewText");
            previewText.textContent = text;
            if (window.speechSynthesis) {
              const utterance = new SpeechSynthesisUtterance(symbol);
              utterance.lang = "en-US";
              utterance.rate = 0.9;
              speechSynthesis.cancel();
              speechSynthesis.speak(utterance);
            }
          });
        });
      }

      function renderConlangList() {
        const conlangList = document.getElementById("conlangList");
        conlangList.innerHTML = state.conlangs.map((lang) => `
          <div class="conlang-card ${lang.id === state.activeConlangId ? "active" : ""}" data-id="${lang.id}">
            <h3>${escapeHtml(lang.name || "Untitled")}</h3>
            <div class="meta">${escapeHtml(lang.family || "No family yet")}</div>
            <span class="pill">${escapeHtml(lang.status || "In progress")}</span>
          </div>
        `).join("");

        conlangList.querySelectorAll(".conlang-card").forEach((card) => {
          card.addEventListener("click", () => {
            state.activeConlangId = card.dataset.id;
            saveState();
            render();
          });
        });
      }

      function renderConlangDetails() {
        const lang = currentConlang();
        if (!lang) return;

        document.getElementById("langNameTitle").textContent = lang.name || "Untitled Conlang";
        document.getElementById("langMeta").textContent = `${lang.family || "No family yet"} • ${lang.status || "In progress"}`;

        document.getElementById("conlangName").value = lang.name || "";
        document.getElementById("conlangFamily").value = lang.family || "";
        document.getElementById("conlangStatus").value = lang.status || "In progress";
        document.getElementById("conlangTags").value = (lang.tags || []).join(", ");
        document.getElementById("conlangDescription").value = lang.description || "";
        document.getElementById("conlangOverview").value = lang.overview || "";

        document.getElementById("phonConsonants").value = lang.phonology?.consonants || "";
        document.getElementById("phonVowels").value = lang.phonology?.vowels || "";
        document.getElementById("phonStress").value = lang.phonology?.stress || "";
        document.getElementById("phonNotes").value = lang.phonology?.notes || "";

        document.getElementById("gramWordOrder").value = lang.grammar?.wordOrder || "";
        document.getElementById("gramCase").value = lang.grammar?.case || "";
        document.getElementById("gramTense").value = lang.grammar?.tense || "";
        document.getElementById("gramNotes").value = lang.grammar?.notes || "";

        document.getElementById("writingScript").value = lang.writing?.script || "";
        document.getElementById("writingNotes").value = lang.writing?.notes || "";
        document.getElementById("cultureNotes").value = lang.culture || "";
      }

      function renderLexicon() {
        const lang = currentConlang();
        const list = document.getElementById("lexiconList");
        if (!lang) return;

        list.innerHTML = (lang.lexicon || []).map((entry, index) => `
          <div class="item-card" data-lexicon-index="${index}">
            <div class="row">
              <div class="field">
                <label>Term</label>
                <input type="text" value="${escapeAttribute(entry.term || "")}" data-field="term" />
              </div>
              <div class="field">
                <label>Gloss</label>
                <input type="text" value="${escapeAttribute(entry.gloss || "")}" data-field="gloss" />
              </div>
              <div class="field">
                <label>Category</label>
                <input type="text" value="${escapeAttribute(entry.category || "")}" data-field="category" />
              </div>
              <div class="field">
                <label>Pronunciation</label>
                <input type="text" value="${escapeAttribute(entry.pronunciation || "")}" data-field="pronunciation" />
              </div>
            </div>
            <div class="field" style="margin-top:10px;">
              <label>Notes</label>
              <textarea data-field="notes">${escapeHtml(entry.notes || "")}</textarea>
            </div>
            <div class="actions">
              <button class="compact-btn danger delete-word" type="button">Delete</button>
            </div>
          </div>
        `).join("") || "<div class='item-card'>No words yet. Add one to begin your lexicon.</div>";

        list.querySelectorAll(".delete-word").forEach((button) => {
          button.addEventListener("click", () => {
            const card = button.closest(".item-card");
            const index = Number(card.dataset.lexiconIndex);
            currentConlang().lexicon.splice(index, 1);
            saveState();
            render();
          });
        });

        list.querySelectorAll("input[data-field], textarea[data-field]").forEach((el) => {
          el.addEventListener("input", () => {
            const card = el.closest(".item-card");
            const index = Number(card.dataset.lexiconIndex);
            const field = el.dataset.field;
            currentConlang().lexicon[index][field] = el.value;
            saveState();
            renderConlangList();
            renderIpaChart();
          });
        });
      }

      function renderExamples() {
        const lang = currentConlang();
        const list = document.getElementById("exampleList");
        list.innerHTML = (lang.examples || []).map((entry, index) => `
          <div class="item-card" data-example-index="${index}">
            <div class="field">
              <label>Phrase</label>
              <input type="text" value="${escapeAttribute(entry.phrase || "")}" data-field="phrase" />
            </div>
            <div class="field" style="margin-top:10px;">
              <label>Translation</label>
              <input type="text" value="${escapeAttribute(entry.translation || "")}" data-field="translation" />
            </div>
            <div class="field" style="margin-top:10px;">
              <label>Notes</label>
              <textarea data-field="notes">${escapeHtml(entry.notes || "")}</textarea>
            </div>
            <div class="actions">
              <button class="compact-btn danger delete-example" type="button">Delete</button>
            </div>
          </div>
        `).join("") || "<div class='item-card'>No example sentences yet.</div>";

        list.querySelectorAll(".delete-example").forEach((button) => {
          button.addEventListener("click", () => {
            const card = button.closest(".item-card");
            const index = Number(card.dataset.exampleIndex);
            currentConlang().examples.splice(index, 1);
            saveState();
            render();
          });
        });

        list.querySelectorAll("input[data-field], textarea[data-field]").forEach((el) => {
          el.addEventListener("input", () => {
            const card = el.closest(".item-card");
            const index = Number(card.dataset.exampleIndex);
            const field = el.dataset.field;
            currentConlang().examples[index][field] = el.value;
            saveState();
            renderConlangList();
          });
        });
      }

      function renderNotes() {
        const lang = currentConlang();
        const list = document.getElementById("noteList");
        list.innerHTML = (lang.notes || []).map((note, index) => `
          <div class="item-card" data-note-index="${index}">
            <div class="field">
              <label>Note</label>
              <textarea data-field="note">${escapeHtml(note)}</textarea>
            </div>
            <div class="actions">
              <button class="compact-btn danger delete-note" type="button">Delete</button>
            </div>
          </div>
        `).join("") || "<div class='item-card'>No notes yet.</div>";

        list.querySelectorAll(".delete-note").forEach((button) => {
          button.addEventListener("click", () => {
            const card = button.closest(".item-card");
            const index = Number(card.dataset.noteIndex);
            currentConlang().notes.splice(index, 1);
            saveState();
            render();
          });
        });

        list.querySelectorAll("textarea[data-field='note']").forEach((textarea) => {
          textarea.addEventListener("input", () => {
            const card = textarea.closest(".item-card");
            const index = Number(card.dataset.noteIndex);
            currentConlang().notes[index] = textarea.value;
            saveState();
          });
        });
      }

      function syncFormToState() {
        const lang = currentConlang();
        if (!lang) return;

        lang.name = document.getElementById("conlangName").value.trim() || "Untitled Conlang";
        lang.family = document.getElementById("conlangFamily").value.trim();
        lang.status = document.getElementById("conlangStatus").value || "In progress";
        lang.tags = document.getElementById("conlangTags").value.split(",").map((tag) => tag.trim()).filter(Boolean);
        lang.description = document.getElementById("conlangDescription").value.trim();
        lang.overview = document.getElementById("conlangOverview").value.trim();

        lang.phonology = {
          consonants: document.getElementById("phonConsonants").value.trim(),
          vowels: document.getElementById("phonVowels").value.trim(),
          stress: document.getElementById("phonStress").value.trim(),
          notes: document.getElementById("phonNotes").value.trim()
        };

        lang.grammar = {
          wordOrder: document.getElementById("gramWordOrder").value.trim(),
          case: document.getElementById("gramCase").value.trim(),
          tense: document.getElementById("gramTense").value.trim(),
          notes: document.getElementById("gramNotes").value.trim()
        };

        lang.writing = {
          script: document.getElementById("writingScript").value.trim(),
          notes: document.getElementById("writingNotes").value.trim()
        };

        lang.culture = document.getElementById("cultureNotes").value.trim();

        saveState();
        renderConlangList();
        renderConlangDetails();
        renderIpaChart();
      }

      function addConlang() {
        const lang = makeBlankConlang(`Conlang ${state.conlangs.length + 1}`);
        state.conlangs.push(lang);
        state.activeConlangId = lang.id;
        saveState();
        render();
      }

      function addLexiconEntry() {
        const lang = currentConlang();
        lang.lexicon.push({ id: crypto.randomUUID(), term: "", gloss: "", category: "", pronunciation: "", notes: "" });
        saveState();
        render();
      }

      function addExampleEntry() {
        const lang = currentConlang();
        lang.examples.push({ id: crypto.randomUUID(), phrase: "", translation: "", notes: "" });
        saveState();
        render();
      }

      function addNoteEntry() {
        const lang = currentConlang();
        lang.notes.push("");
        saveState();
        render();
      }

      function exportData() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "conlang-workshop-export.json";
        a.click();
        URL.revokeObjectURL(url);
      }

      function importData(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (!parsed.conlangs || !Array.isArray(parsed.conlangs)) {
              throw new Error("Invalid export format");
            }
            state.conlangs = parsed.conlangs;
            state.activeConlangId = parsed.activeConlangId || state.conlangs[0]?.id || null;
            saveState();
            render();
          } catch (error) {
            alert("Could not import this JSON file. Make sure it is a valid Conlang Workshop export.");
          }
        };
        reader.readAsText(file);
      }

      function resetData() {
        const confirmed = confirm("Reset everything in this workshop? This removes all conlangs and notes from this browser.");
        if (!confirmed) return;
        localStorage.removeItem(STORAGE_KEY);
        Object.assign(state, structuredClone(baseState));
        saveState();
        render();
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function escapeAttribute(value) {
        return escapeHtml(value).replace(/`/g, "&#96;");
      }

      function bindStaticEvents() {
        document.getElementById("newConlangBtn").addEventListener("click", addConlang);
        document.getElementById("exportBtn").addEventListener("click", exportData);
        document.getElementById("resetBtn").addEventListener("click", resetData);
        document.getElementById("addLexiconBtn").addEventListener("click", addLexiconEntry);
        document.getElementById("addExampleBtn").addEventListener("click", addExampleEntry);
        document.getElementById("addNoteBtn").addEventListener("click", addNoteEntry);
        document.getElementById("ipaPlayBtn").addEventListener("click", speakPreview);
        document.getElementById("importInput").addEventListener("change", (event) => {
          importData(event.target.files[0]);
          event.target.value = "";
        });

        [
          "conlangName",
          "conlangFamily",
          "conlangStatus",
          "conlangTags",
          "conlangDescription",
          "conlangOverview",
          "phonConsonants",
          "phonVowels",
          "phonStress",
          "phonNotes",
          "gramWordOrder",
          "gramCase",
          "gramTense",
          "gramNotes",
          "writingScript",
          "writingNotes",
          "cultureNotes"
        ].forEach((id) => {
          document.getElementById(id).addEventListener("input", syncFormToState);
          document.getElementById(id).addEventListener("change", syncFormToState);
        });
      }

      function render() {
        ensureActiveConlang();
        renderConlangList();
        renderConlangDetails();
        renderIpaChart();
        renderLexicon();
        renderExamples();
        renderNotes();
      }

      bindStaticEvents();
      render();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter - Web Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #1a1a2e;
            border: 3px solid #00ff88;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .game-info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ff88;
            font-size: 14px;
            z-index: 100;
        }

        .score {
            margin-bottom: 5px;
        }

        .lives {
            margin-bottom: 5px;
        }

        .wave {
            margin-bottom: 5px;
        }

        .player {
            position: absolute;
            width: 40px;
            height: 40px;
            bottom: 20px;
            left: 380px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            clip-path: polygon(50% 0%, 100% 100%, 75% 80%, 50% 90%, 25% 80%, 0% 100%);
            z-index: 10;
        }

        .bullet {
            position: absolute;
            width: 5px;
            height: 15px;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .enemy {
            position: absolute;
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #ff006e, #d00050);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            z-index: 5;
        }

        .explosion {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #ffaa00, #ff6600, transparent);
            border-radius: 50%;
            animation: explode 0.5s ease-out forwards;
            z-index: 8;
        }

        @keyframes explode {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 0;
            }
        }

        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            text-align: center;
            z-index: 200;
            border: 2px solid #00ff88;
            border-radius: 10px;
            min-width: 300px;
        }

        .game-over h1 {
            color: #ff006e;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .game-over p {
            color: #00ff88;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .game-over button {
            background: #00ff88;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        .game-over button:hover {
            transform: scale(1.1);
        }

        .instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #999;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <div class="game-info">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="lives">Lives: <span id="lives">3</span></div>
            <div class="wave">Wave: <span id="wave">1</span></div>
        </div>
        <div class="player" id="player"></div>
        <div class="game-over" id="gameOver">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Wave Reached: <span id="finalWave">1</span></p>
            <button onclick="location.reload()">Play Again</button>
        </div>
        <div class="instructions">
            Arrow Keys or A/D to move • Space to shoot
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('gameContainer');
        const player = document.getElementById('player');
        const gameOverScreen = document.getElementById('gameOver');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const waveDisplay = document.getElementById('wave');

        const game = {
            score: 0,
            lives: 3,
            wave: 1,
            isGameOver: false,
            playerX: 380,
            playerY: 560,
            playerSpeed: 7,
            bullets: [],
            enemies: [],
            explosions: []
        };

        const keys = {};

        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                e.preventDefault();
                shootBullet();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function movePlayer() {
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                game.playerX = Math.max(0, game.playerX - game.playerSpeed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                game.playerX = Math.min(760, game.playerX + game.playerSpeed);
            }
            player.style.left = game.playerX + 'px';
        }

        function shootBullet() {
            if (game.isGameOver) return;
            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            gameContainer.appendChild(bullet);
            
            const bulletObj = {
                x: game.playerX + 17.5,
                y: game.playerY - 15,
                element: bullet
            };
            
            game.bullets.push(bulletObj);
            bullet.style.left = bulletObj.x + 'px';
            bullet.style.top = bulletObj.y + 'px';
        }

        function updateBullets() {
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const bullet = game.bullets[i];
                bullet.y -= 8;
                
                if (bullet.y < 0) {
                    bullet.element.remove();
                    game.bullets.splice(i, 1);
                } else {
                    bullet.element.style.top = bullet.y + 'px';
                    checkBulletCollisions(i);
                }
            }
        }

        function checkBulletCollisions(bulletIndex) {
            const bullet = game.bullets[bulletIndex];
            
            for (let i = game.enemies.length - 1; i >= 0; i--) {
                const enemy = game.enemies[i];
                
                if (bullet.x < enemy.x + 35 &&
                    bullet.x + 5 > enemy.x &&
                    bullet.y < enemy.y + 35 &&
                    bullet.y + 15 > enemy.y) {
                    
                    createExplosion(enemy.x, enemy.y);
                    enemy.element.remove();
                    game.enemies.splice(i, 1);
                    bullet.element.remove();
                    game.bullets.splice(bulletIndex, 1);
                    game.score += 10;
                    scoreDisplay.textContent = game.score;
                    
                    if (game.enemies.length === 0) {
                        nextWave();
                    }
                    break;
                }
            }
        }

        function createExplosion(x, y) {
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = x + 'px';
            explosion.style.top = y + 'px';
            gameContainer.appendChild(explosion);
            
            setTimeout(() => explosion.remove(), 500);
        }

        function spawnEnemy() {
            if (game.isGameOver) return;
            
            const enemy = document.createElement('div');
            enemy.className = 'enemy';
            gameContainer.appendChild(enemy);
            
            const x = Math.random() * 765;
            const enemyObj = {
                x: x,
                y: Math.random() * -100 - 50,
                vx: (Math.random() - 0.5) * 3,
                vy: Math.random() * 2 + 1,
                element: enemy
            };
            
            game.enemies.push(enemyObj);
            enemy.style.left = enemyObj.x + 'px';
            enemy.style.top = enemyObj.y + 'px';
        }

        function updateEnemies() {
            for (let i = game.enemies.length - 1; i >= 0; i--) {
                const enemy = game.enemies[i];
                enemy.x += enemy.vx;
                enemy.y += enemy.vy;
                
                if (enemy.y > 600) {
                    enemy.element.remove();
                    game.enemies.splice(i, 1);
                    game.lives--;
                    livesDisplay.textContent = game.lives;
                    
                    if (game.lives <= 0) {
                        endGame();
                    }
                } else {
                    enemy.element.style.left = enemy.x + 'px';
                    enemy.element.style.top = enemy.y + 'px';
                    
                    checkEnemyCollision(enemy);
                }
            }
        }

        function checkEnemyCollision(enemy) {
            if (game.playerX < enemy.x + 35 &&
                game.playerX + 40 > enemy.x &&
                game.playerY < enemy.y + 35 &&
                game.playerY + 40 > enemy.y) {
                
                createExplosion(game.playerX, game.playerY);
                enemy.element.remove();
                game.enemies.splice(game.enemies.indexOf(enemy), 1);
                game.lives--;
                livesDisplay.textContent = game.lives;
                
                if (game.lives <= 0) {
                    endGame();
                }
            }
        }

        function nextWave() {
            game.wave++;
            waveDisplay.textContent = game.wave;
            
            const enemyCount = 3 + game.wave;
            let spawned = 0;
            
            const spawnInterval = setInterval(() => {
                if (spawned < enemyCount && !game.isGameOver) {
                    spawnEnemy();
                    spawned++;
                } else {
                    clearInterval(spawnInterval);
                }
            }, 500);
        }

        function endGame() {
            game.isGameOver = true;
            document.getElementById('finalScore').textContent = game.score;
            document.getElementById('finalWave').textContent = game.wave;
            gameOverScreen.style.display = 'block';
        }

        function gameLoop() {
            if (!game.isGameOver) {
                movePlayer();
                updateBullets();
                updateEnemies();
            }
            requestAnimationFrame(gameLoop);
        }

        // Start the game
        nextWave();
        gameLoop();
    </script>
</body>
</html>
